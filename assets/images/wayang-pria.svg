<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="maleGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#B88E4B"/>
      <stop offset="100%" stop-color="#8E6527"/>
    </linearGradient>
    <filter id="maleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#maleDropShadow)">
    <!-- Main Silhouette of Raden Kamajaya (Noble Male Figure) -->

    <!-- Cempurit (Tangkai Penggerak Tangan Wayang) - Wayang Kulit realism -->
    <path d="M125 240 L70 440" stroke="#8E6527" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M185 280 L230 460" stroke="#8E6527" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tangkai Utama (Cempurit Badan) -->
    <path d="M155 360 L155 510" stroke="#8E6527" stroke-width="4" stroke-linecap="round"/>

    <!-- Head & Crown (Makutha / Gelung Supit Urang) -->
    <path d="M140 100 
             C135 85, 125 70, 110 60 
             C100 52, 90 50, 80 55 
             C70 60, 68 75, 78 85 
             C88 95, 105 102, 115 110
             C105 115, 95 125, 95 135
             C95 145, 105 155, 118 152
             L125 158
             C120 168, 122 178, 130 185
             L140 185
             L148 165
             C158 160, 168 150, 168 138
             C168 120, 155 105, 140 100 Z" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.8"/>

    <!-- Profile Face (Halus/Luruh: Noble downward gentle gaze) -->
    <!-- Pointed nose, gentle serene lips, elongated noble eye -->
    <path d="M140 100 
             C155 108, 172 118, 185 128
             C192 134, 195 137, 190 140
             C182 142, 178 142, 175 146
             C172 149, 175 153, 170 156
             C165 158, 155 156, 148 165" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.8"/>

    <!-- Noble Eye & Eyebrow detail -->
    <path d="M152 122 C160 120, 170 126, 172 130 C165 130, 158 126, 152 122 Z" fill="url(#maleGoldGrad)"/>
    <path d="M150 116 C162 114, 172 120, 176 124" stroke="url(#maleGoldGrad)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Ear & Sumping (Perhiasan Telinga) -->
    <path d="M130 135 C122 138, 118 146, 124 152 C128 155, 134 150, 132 142 Z" fill="url(#maleGoldGrad)"/>
    <path d="M118 146 C108 148, 104 158, 112 165 C118 168, 125 162, 122 155" fill="none" stroke="url(#maleGoldGrad)" stroke-width="1.2"/>

    <!-- Neck & Torso (Praba & Kalung Penanggalan) -->
    <path d="M140 185 C145 205, 155 220, 160 240 C162 250, 158 265, 150 280 L135 275 C132 255, 130 230, 130 185 Z" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.5"/>

    <!-- Kalung Bulan Sabit & Hiasan Dada Emas -->
    <path d="M142 195 C152 205, 160 215, 165 230 C155 230, 145 220, 138 205 Z" fill="url(#maleGoldGrad)"/>
    <circle cx="152" cy="225" r="3.5" fill="#FFE59E" stroke="#8E6527" stroke-width="0.8"/>

    <!-- Praba Emas di Belakang Punggung (Aura Kebesaran) -->
    <path d="M130 180 C95 185, 75 220, 80 270 C85 305, 110 325, 135 315 C125 295, 120 250, 130 180 Z" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="2"/>
    <path d="M125 195 C98 205, 88 230, 92 265 C96 290, 112 305, 130 298" 
          fill="none" stroke="url(#maleGoldGrad)" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Arm Front (Tangan Depan Melenggang Luwes) -->
    <path d="M155 210 C175 220, 195 240, 205 265 L195 275 C185 255, 170 238, 150 225 Z" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.5"/>
    <path d="M205 265 C215 285, 218 310, 210 330 L200 325 C206 310, 204 290, 195 275 Z" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.5"/>
    <!-- Jari Tangan Ngiting / Nyempurit -->
    <path d="M210 330 C215 338, 222 342, 220 348 C216 352, 210 348, 206 342 L200 325" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.2"/>
    <!-- Kelat Bahu Emas (Armlet) -->
    <rect x="180" y="235" width="14" height="6" rx="2" transform="rotate(35 180 235)" fill="url(#maleGoldGrad)"/>

    <!-- Arm Back (Tangan Belakang) -->
    <path d="M135 220 C120 235, 105 260, 100 290 L108 295 C114 270, 126 248, 140 232 Z" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.2"/>

    <!-- Waist & Belt (Pending & Timang Emas) -->
    <path d="M132 275 L168 285 L165 298 L130 288 Z" fill="url(#maleGoldGrad)"/>
    <circle cx="150" cy="292" r="4.5" fill="#FFE59E" stroke="#8E6527" stroke-width="1"/>

    <!-- Kain Dodot / Kampuh Bawahan dengan Lipatan Parang/Batik -->
    <path d="M130 288 
             C145 310, 170 325, 185 365 
             C195 395, 180 435, 150 460 
             C135 440, 120 405, 125 365 
             L115 355 C110 330, 115 305, 130 288 Z" 
          fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="2"/>

    <!-- Sampur Melambai (Selendang Tari Keraton) -->
    <path d="M148 295 C165 335, 175 390, 150 445 C145 420, 152 370, 140 330 Z" 
          fill="url(#maleGoldGrad)" opacity="0.85"/>
    <path d="M135 440 C145 455, 160 460, 175 455" stroke="url(#maleGoldGrad)" stroke-width="1.5" fill="none"/>

    <!-- Ornamen Garis Batik Emas pada Kain Dodot -->
    <g stroke="url(#maleGoldGrad)" stroke-width="0.8" opacity="0.75">
      <line x1="135" y1="315" x2="165" y2="330"/>
      <line x1="130" y1="335" x2="175" y2="355"/>
      <line x1="128" y1="360" x2="182" y2="385"/>
      <line x1="132" y1="390" x2="178" y2="415"/>
      <line x1="136" y1="420" x2="165" y2="440"/>
    </g>

    <!-- Kaki & Celana Cinde dengan Gelang Kaki (Binggel Emas) -->
    <path d="M138 450 L135 480 L145 482 L148 452 Z" fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1.2"/>
    <rect x="134" y="475" width="13" height="4" rx="1" fill="url(#maleGoldGrad)"/>
    <path d="M135 482 C145 484, 155 486, 160 488 C158 493, 142 493, 132 488 Z" fill="#1C140F" stroke="url(#maleGoldGrad)" stroke-width="1"/>
  </g>
</svg>
