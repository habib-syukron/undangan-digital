<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#B88E4B"/>
      <stop offset="100%" stop-color="#8E6527"/>
    </linearGradient>
  </defs>

  <!-- Javanese Jepara Floral Carving Corner (Lung-lungan & Patran) -->
  <g stroke="url(#cornerGold)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Border Lines -->
    <path d="M4 116 L4 20 C4 11, 11 4, 20 4 L116 4"/>
    <path d="M12 116 L12 24 C12 17, 17 12, 24 12 L116 12" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Corner Rosette / Center curl -->
    <path d="M8 8 C16 16, 24 24, 35 25 C46 26, 52 18, 48 10 C44 2, 30 5, 26 15 C22 25, 28 36, 40 38" fill="none"/>
    <circle cx="28" cy="28" r="3" fill="url(#cornerGold)"/>

    <!-- Flowing Javanese Leaves (Patran) along top bar -->
    <path d="M50 12 C60 6, 75 8, 85 4 C80 12, 70 16, 60 14" fill="#B88E4B" fill-opacity="0.3"/>
    <path d="M85 12 C95 7, 105 8, 115 5 C110 13, 102 15, 95 14" fill="#B88E4B" fill-opacity="0.2"/>

    <!-- Flowing Javanese Leaves along left bar -->
    <path d="M12 50 C6 60, 8 75, 4 85 C12 80, 16 70, 14 60" fill="#B88E4B" fill-opacity="0.3"/>
    <path d="M12 85 C7 95, 8 105, 5 115 C13 110, 15 102, 14 95" fill="#B88E4B" fill-opacity="0.2"/>

    <!-- Inner Spiral Swirl -->
    <path d="M25 45 C35 55, 45 45, 40 35 C35 25, 25 32, 30 40" fill="none" stroke-width="1.2"/>
  </g>
</svg>
